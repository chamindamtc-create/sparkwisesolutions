    <script>
        // Electric Sparks & Lightning Canvas Simulation
        (function initElectricCanvas() {
            const canvas = document.getElementById('electricCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const particleCount = 35;
            let mouse = { x: null, y: null };

            function resize() {
                width = canvas.width = canvas.parentElement.offsetWidth;
                height = canvas.height = canvas.parentElement.offsetHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            window.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                mouse.x = e.clientX - rect.left;
                mouse.y = e.clientY - rect.top;
            });
            window.addEventListener('mouseleave', () => {
                mouse.x = null;
                mouse.y = null;
            });

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.8;
                    this.vy = (Math.random() - 0.5) * 0.8;
                    this.radius = Math.random() * 2 + 1;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#F59E0B';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#FBBF24';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }

            function drawLightning(x1, y1, x2, y2) {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                const midX = (x1 + x2) / 2 + (Math.random() - 0.5) * 15;
                const midY = (y1 + y2) / 2 + (Math.random() - 0.5) * 15;
                ctx.lineTo(midX, midY);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(245, 158, 11, 0.4)' : 'rgba(56, 189, 248, 0.35)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();

                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 110) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(245, 158, 11, ${0.25 * (1 - dist / 110)})`;
                            ctx.lineWidth = 0.75;
                            ctx.stroke();
                        }
                    }

                    // Mouse lightning arc interaction
                    if (mouse.x !== null && mouse.y !== null) {
                        const mdx = particles[i].x - mouse.x;
                        const mdy = particles[i].y - mouse.y;
                        const mDist = Math.sqrt(mdx * mdx + mdy * mdy);
                        if (mDist < 140) {
                            drawLightning(particles[i].x, particles[i].y, mouse.x, mouse.y);
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();

        // Animated Statistics Counter using IntersectionObserver
        document.addEventListener('DOMContentLoaded', function () {
            const counters = document.querySelectorAll('.counter-value');
            let hasAnimated = false;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !hasAnimated) {
                        hasAnimated = true;
                        counters.forEach(counter => {
                            const target = +counter.getAttribute('data-target');
                            const duration = 1600; // ms
                            const step = target / (duration / 16);
                            let current = 0;

                            const timer = setInterval(() => {
                                current += step;
                                if (current >= target) {
                                    counter.textContent = target;
                                    clearInterval(timer);
                                } else {
                                    counter.textContent = Math.floor(current);
                                }
                            }, 16);
                        });
                    }
                });
            }, { threshold: 0.3 });

            const statsContainer = document.getElementById('statsCounterContainer');
            if (statsContainer) observer.observe(statsContainer);
        });

