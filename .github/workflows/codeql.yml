            });

            // Set WhatsApp link
            const waUrl = `https://wa.me/94777464880?text=${encodeURIComponent(`Hello Sparkwise Solutions, I would like to inquire about booking: ${data.title}.`)}`;
            document.getElementById('modalWhatsAppBtn').href = waUrl;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);
            document.body.style.overflow = 'hidden';
        }

        function filterGallery(category, buttonElement) {
            const tabButtons = document.querySelectorAll('.gallery-tab-btn');
            tabButtons.forEach(btn => {
                btn.classList.remove('active', 'bg-amber-500', 'text-slate-950', 'border-amber-400', 'shadow-glow-amber');
                btn.classList.add('bg-brand-card', 'text-slate-300', 'border-brand-border');
            });
            if (buttonElement) {
                buttonElement.classList.add('active', 'bg-amber-500', 'text-slate-950', 'border-amber-400', 'shadow-glow-amber');
                buttonElement.classList.remove('bg-brand-card', 'text-slate-300', 'border-brand-border');
            }

            const items = document.querySelectorAll('.gallery-item');
            items.forEach(item => {
                const itemCat = item.getAttribute('data-category');
                if (category === 'all' || itemCat === category) {
                    item.style.display = 'block';
                    item.classList.add('animate-fadeIn');
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function closeServiceModal() {
            const modal = document.getElementById('serviceModal');
            if (!modal) return;
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeServiceModal();
        });

        // Close modal when clicking outside
        const serviceModalElem = document.getElementById('serviceModal');
        if (serviceModalElem) {
            serviceModalElem.addEventListener('click', (e) => {
                if (e.target === serviceModalElem) closeServiceModal();
            });
        }

        function bookFromModal() {
            const data = serviceModalData[currentModalServiceKey];
            closeServiceModal();
            if (data) {
                selectServiceForQuote(data.title);
            }
        }

        // Initialize default calculator values on page load
        document.addEventListener('DOMContentLoaded', () => {
            updateCalculatorLive();
        });

        document.addEventListener('DOMContentLoaded', function () {
            // Initialize AOS (Animate on Scroll)
            AOS.init({
                duration: 700,
                easing: 'ease-out-cubic',
                once: true,
                offset: 50
            });

            // Mobile menu toggle functionality
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mobileMenu = document.getElementById('mobileMenu');
            const menuIcon = document.getElementById('menuIcon');
            const mobileLinks = document.querySelectorAll('.mobile-nav-link');

            if (mobileMenuBtn && mobileMenu) {
                mobileMenuBtn.addEventListener('click', function () {
                    mobileMenu.classList.toggle('hidden');
                    if (mobileMenu.classList.contains('hidden')) {
                        menuIcon.className = 'fa-solid fa-bars text-xl';
                    } else {
                        menuIcon.className = 'fa-solid fa-xmark text-xl text-amber-400';
                    }
                });

                // Auto-close drawer on link click
                mobileLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        mobileMenu.classList.add('hidden');
                        menuIcon.className = 'fa-solid fa-bars text-xl';
                    });
                });
            }
        });

        function showToast(title, message, isSuccess = true) {
            const toast = document.getElementById('toastNotification');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            if (!toast) return;

            toastTitle.textContent = title;
            toastMessage.textContent = message;

            if (isSuccess) {
                toastIcon.className = 'w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0 text-sm mt-0.5';
                toastIcon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                toast.classList.remove('border-amber-500/50');
                toast.classList.add('border-emerald-500/50');
            } else {
                toastIcon.className = 'w-8 h-8 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0 text-sm mt-0.5';
                toastIcon.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
                toast.classList.remove('border-emerald-500/50');
                toast.classList.add('border-amber-500/50');
            }

            toast.classList.remove('translate-x-full', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-x-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0', 'pointer-events-none');
                toast.classList.remove('translate-x-0', 'opacity-100');
            }, 4500);
        }

        function copyPhoneNumber() {
            const phoneNumber = "0777464880";
            const tempInput = document.createElement("input");
            tempInput.value = phoneNumber;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            showToast("Phone Number Copied!", "077 746 4880 has been copied to your clipboard.", true);
        }

        function selectServiceForQuote(serviceName) {
            const selectElem = document.getElementById('serviceSelect');
            if (selectElem) {
                selectElem.value = serviceName;
            }
            const quoteSection = document.getElementById('quick-quote');
            if (quoteSection) {
                quoteSection.scrollIntoView({ behavior: 'smooth' });
            }
            showToast("Service Selected", `"${serviceName}" has been chosen in the inquiry form.`, true);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            const service = document.getElementById('serviceSelect').value;
            const location = document.getElementById('clientLocation').value.trim();
            const message = document.getElementById('clientMessage').value.trim();

            if (!name || !phone || !service) {
                showToast("Missing Information", "Please fill in your name, phone number, and service.", false);
                return;
            }

            // Construct formatted WhatsApp message
            let waText = `*New Service Inquiry - Sparkwise Solutions*\n\n`;
            waText += `*Name:* ${name}\n`;
            waText += `*Phone:* ${phone}\n`;
            waText += `*Service:* ${service}\n`;
            if (location) waText += `*Location:* ${location}\n`;
            if (message) waText += `*Details:* ${message}\n`;

            const encodedWa = encodeURIComponent(waText);
            const waUrl = `https://wa.me/94777464880?text=${encodedWa}`;

            // Show friendly non-alert toast
            showToast("Inquiry Ready!", "Opening WhatsApp to send your service details to W A R K Chaminda...", true);

            // Open WhatsApp with pre-filled message
            setTimeout(() => {
                window.open(waUrl, '_blank');
            }, 1200);

            // Reset form
            document.getElementById('inquiryForm').reset();
        }

        function sendViaWhatsAppDirect() {
            const name = document.getElementById('clientName').value.trim();
            const service = document.getElementById('serviceSelect').value;
            const location = document.getElementById('clientLocation').value.trim();

            let text = "Hello Sparkwise Solutions, I would like to inquire about your electrical and maintenance services.";
            if (service) text += ` Specifically for: ${service}.`;
            if (location) text += ` My location: ${location}.`;
            if (name) text += ` (From: ${name})`;

            const url = `https://wa.me/94777464880?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
