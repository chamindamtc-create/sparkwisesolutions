            // Calculate base cost
            let baseRate = isThreePhase ? cfg.baseThree : cfg.baseSingle;
            let total = 0;

            if (currentCalcType === 'db') {
                total = baseRate + (sliderVal * 700);
            } else {
                total = baseRate * sliderVal;
